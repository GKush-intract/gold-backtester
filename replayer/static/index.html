<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gold Replayer</title>
  <link rel="stylesheet" href="/css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/klinecharts@9.8.10/dist/umd/klinecharts.min.js"></script>
</head>
<body>
  <header id="topbar">
    <span class="brand">🥇 Replayer</span>
    <span id="clock-readout">--</span>
    <span id="tf-buttons"></span>
    <span id="controls"></span>
    <span id="speed"></span>
  </header>
  <main>
    <section id="chart"></section>
    <aside id="side">
      <div id="account"></div>
      <div id="ticket"></div>
      <div id="orders"></div>
      <div id="blotter"></div>
      <div id="notes"></div>
    </aside>
  </main>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
